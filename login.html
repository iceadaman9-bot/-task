<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to ETHIO TASK">
  <title>Login - ETHIO TASK</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .logo span {
      color: #16a34a;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      margin-bottom: 17px;
    }

    input:focus {
      border-color: #16a34a;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: -5px;
      margin-bottom: 20px;
      color: #16a34a;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #6b7280;
      font-size: 14px;
    }

    .register a,
    .back {
      color: #16a34a;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
    }

    .security {
      margin-top: 20px;
      padding: 12px;
      background: #f0fdf4;
      border-radius: 9px;
      color: #166534;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 500px) {
      .card {
        padding: 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      🇪🇹 <span>ETHIO</span> TASK
    </div>

    <div class="card">

      <h1>Welcome Back</h1>

      <p class="subtitle">
        Login to your ETHIO TASK account.
      </p>

      <form id="loginForm">

        <label for="login">
          Phone Number or Email
        </label>

        <input
          type="text"
          id="login"
          placeholder="09XXXXXXXX or email"
          autocomplete="username"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <a href="#" class="forgot" id="forgotPassword">
          Forgot Password?
        </a>

        <button type="submit">
          Login
        </button>

      </form>

      <div class="register">
        Don't have an account?
        <a href="register.html">Create Account</a>
      </div>

      <div class="security">
        🔐 Your account will be protected by secure
        authentication and OTP verification when the backend
        is connected.
      </div>

      <a href="Index.html" class="back">
        ← Back to Home
      </a>

    </div>

  </div>

  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        alert(
          "Login interface is ready. Secure authentication and OTP verification will be connected to the backend."
        );

      });

    document
      .getElementById("forgotPassword")
      .addEventListener("click", function(event) {

        event.preventDefault();

        alert(
          "Password recovery and OTP verification will be connected to the secure backend."
        );

      });

  </script>

</body>
</html>
