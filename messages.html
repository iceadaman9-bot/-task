<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Messages - ETHIO TASK</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #1f2937;
    }

    header {
      background: #0f5132;
      color: white;
      padding: 16px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .header-links {
      display: flex;
      gap: 10px;
    }

    .header-links a {
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,0.12);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .page-title {
      margin-bottom: 20px;
    }

    .page-title h1 {
      color: #0f5132;
      font-size: 30px;
      margin-bottom: 7px;
    }

    .page-title p {
      color: #667085;
    }

    .messages-box {
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      min-height: 600px;
      display: grid;
      grid-template-columns: 320px 1fr;
      overflow: hidden;
    }

    /* CONTACTS */

    .contacts {
      border-right: 1px solid #eaecf0;
      background: #fafafa;
    }

    .contacts-header {
      padding: 20px;
      border-bottom: 1px solid #eaecf0;
    }

    .contacts-header h2 {
      font-size: 19px;
      margin-bottom: 14px;
    }

    .search {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      outline: none;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 18px;
      cursor: pointer;
      border-bottom: 1px solid #eaecf0;
    }

    .contact:hover {
      background: #f0fdf4;
    }

    .contact.active {
      background: #ecfdf3;
    }

    .contact-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #0f5132;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .contact-info {
      min-width: 0;
      flex: 1;
    }

    .contact-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .last-message {
      color: #667085;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHAT */

    .chat {
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 18px 22px;
      border-bottom: 1px solid #eaecf0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-user-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #0f5132;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .chat-user h3 {
      margin-bottom: 4px;
    }

    .online {
      color: #067647;
      font-size: 12px;
    }

    .chat-body {
      flex: 1;
      padding: 22px;
      overflow-y: auto;
      background: #fcfcfc;
    }

    .empty-chat {
      height: 100%;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #667085;
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .empty-chat h3 {
      color: #344054;
      margin-bottom: 8px;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .message.sent {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 70%;
      padding: 11px 15px;
      border-radius: 13px;
      background: #f2f4f7;
      line-height: 1.5;
      font-size: 14px;
    }

    .sent .bubble {
      background: #0f5132;
      color: white;
    }

    .time {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      opacity: 0.7;
    }

    .chat-input-area {
      padding: 15px;
      border-top: 1px solid #eaecf0;
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    .send-btn {
      border: none;
      background: #0f5132;
      color: white;
      border-radius: 9px;
      padding: 0 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .send-btn:hover {
      background: #0b3d26;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #0f5132;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 750px) {

      header {
        padding: 14px 4%;
      }

      .logo {
        font-size: 18px;
      }

      .header-links a {
        font-size: 12px;
        padding: 8px 9px;
      }

      .messages-box {
        grid-template-columns: 1fr;
      }

      .contacts {
        border-right: none;
        border-bottom: 1px solid #eaecf0;
      }

      .contact:not(:first-of-type) {
        display: none;
      }

      .chat-body {
        min-height: 300px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    🇪🇹 ETHIO TASK
  </div>

  <div class="header-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="tasks.html">Find Tasks</a>
  </div>

</header>


<main>

  <div class="page-title">

    <h1>Messages</h1>

    <p>
      Communicate with clients and freelancers.
    </p>

  </div>


  <div class="messages-box">


    <!-- CONTACT LIST -->

    <div class="contacts">

      <div class="contacts-header">

        <h2>
          Conversations
        </h2>

        <input
          type="text"
          class="search"
          id="contactSearch"
          placeholder="Search messages..."
        >

      </div>


      <div
        class="contact active"
        onclick="openChat('Client')"
      >

        <div class="contact-avatar">
          C
        </div>

        <div class="contact-info">

          <div class="contact-name">
            Client
          </div>

          <div class="last-message">
            No messages yet
          </div>

        </div>

      </div>


      <div
        class="contact"
        onclick="openChat('Freelancer')"
      >

        <div class="contact-avatar">
          F
        </div>

        <div class="contact-info">

          <div class="contact-name">
            Freelancer
          </div>

          <div class="last-message">
            Start a conversation
          </div>

        </div>

      </div>

    </div>


    <!-- CHAT -->

    <div class="chat">

      <div class="chat-header">

        <div
          class="chat-user-avatar"
          id="chatAvatar"
        >
          C
        </div>

        <div class="chat-user">

          <h3 id="chatName">
            Client
          </h3>

          <span class="online">
            ● ETHIO TASK User
          </span>

        </div>

      </div>


      <div
        class="chat-body"
        id="chatBody"
      >

        <div class="empty-chat">

          <div class="empty-icon">
            💬
          </div>

          <h3>
            No messages yet
          </h3>

          <p>
            Send a message to start the conversation.
          </p>

        </div>

      </div>


      <form
        class="chat-input-area"
        id="messageForm"
      >

        <input
          type="text"
          id="messageInput"
          class="chat-input"
          placeholder="Write a message..."
          autocomplete="off"
        >

        <button
          type="submit"
          class="send-btn"
        >
          Send
        </button>

      </form>

    </div>

  </div>


  <a
    href="dashboard.html"
    class="back"
  >
    ← Back to Dashboard
  </a>

</main>


<script>

  let currentUser = "Client";


  function openChat(user) {

    currentUser = user;

    document.getElementById("chatName").textContent = user;

    document.getElementById("chatAvatar").textContent =
      user.charAt(0);

    document.getElementById("chatBody").innerHTML = `
      <div class="empty-chat">
        <div class="empty-icon">💬</div>
        <h3>No messages yet</h3>
        <p>Send a message to start the conversation.</p>
      </div>
    `;

  }


  document
    .getElementById("messageForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      const input =
        document.getElementById("messageInput");

      const text =
        input.value.trim();

      if (text === "") {
        return;
      }

      const chatBody =
        document.getElementById("chatBody");

      const empty =
        chatBody.querySelector(".empty-chat");

      if (empty) {
        empty.remove();
      }

      const message =
        document.createElement("div");

      message.className = "message sent";

      message.innerHTML = `
        <div class="bubble">
          ${escapeHTML(text)}
          <span class="time">Just now</span>
        </div>
      `;

      chatBody.appendChild(message);

      input.value = "";

      chatBody.scrollTop =
        chatBody.scrollHeight;

    });


  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  document
    .getElementById("contactSearch")
    .addEventListener("input", function() {

      const search =
        this.value.toLowerCase();

      const contacts =
        document.querySelectorAll(".contact");

      contacts.forEach(function(contact) {

        const name =
          contact
            .querySelector(".contact-name")
            .textContent
            .toLowerCase();

        contact.style.display =
          name.includes(search)
            ? "flex"
            : "none";

      });

    });

</script>

</body>
</html>
